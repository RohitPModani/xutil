<!DOCTYPE html>
<html lang="en">
  <head>
    <style>
      html {
        transition: none !important;
      }
    </style>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      data-rh="true"
      name="description"
      content="Free online developer tools: JWT debugger, JSON validator, QR generator. No ads, no tracking, no BS. The fastest privacy-first toolbox for coders."
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f7fdff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0e1518" />
    <title data-rh="true">XUtil</title>

    <!-- Light/Dark mode favicons -->
    <link
      rel="icon"
      href="/cog_light.svg"
      media="(prefers-color-scheme: light)"
      type="image/svg+xml"
    />
    <link
      rel="icon"
      href="/cog_dark.svg"
      media="(prefers-color-scheme: dark)"
      type="image/svg+xml"
    />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">

    <script>
      // Must mirror getInitialTheme() in ThemeToggle: a visitor whose system
      // is dark and who has no saved preference would otherwise get a flash of
      // the light theme before React mounts.
      try {
        var saved = localStorage.getItem("xutil-theme");
        var dark = saved
          ? saved === "dark"
          : window.matchMedia("(prefers-color-scheme: dark)").matches;
        if (dark) document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
